spring.application.name=ubsystem
spring.config.import=optional:file:.env[.properties]

# Database

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ubs_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=1800000

# JPA

# Assignment-complete mode: Flyway owns schema + DB triggers (Task 6). Hibernate must not alter tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# DevTools — must be false: restart closes the JDBC connection while Hibernate is still updating schema
spring.devtools.restart.enabled=false

# App

app.institution.name=Water and Sanitation Corporation
app.message.dispatch-interval-ms=60000
# Set true only when Flyway/triggers are disabled; otherwise DB triggers insert messages (Task 6).
app.messaging.java-fallback=false

# OTP (login, signup verification, password reset)

app.otp.validity-minutes=10
app.otp.resend-cooldown-seconds=60

# Email — auth OTPs, welcome credentials, and bill/payment notifications

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT

app.jwt.secret=${JWT_SECRET:CHANGE_ME_IN_ENV}
app.jwt.expiration=86400000

# Springdoc

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.doc-expansion=none
